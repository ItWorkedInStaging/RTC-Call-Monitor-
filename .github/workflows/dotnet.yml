# dotnet.yml
# Version: 2.0.0
# Changelog:
#   2.0.0 - .NET 10 SDK; actions/checkout and setup-dotnet v4; build Release;
#           run the RtcCallMonitor.Tests project. Also runs on manual dispatch.
#   1.0.0 - Original workflow (.NET 5).

name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
